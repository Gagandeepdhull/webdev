<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>employee detaail form</h1>
    <form>

        <label for="name">Full name:</label>
        <input type="text" id="name" name="fname"><br><br>

        <label for="email">Email:</label>
        <input type="email" name="femail" id="email" required><br><br>
    
        <label for="phone">Phone number:</label>
        <input type="number" name="fphone" id="phone"><br><br>

        <label for="gender">Gender:</label>

        <input type="radio" name="gender" id="male" value="male">
        <label for="male">Male:</label>

        <input type="radio" name="gender" id="female" value="female">
        <label for="female">Female:</label>

        <input type="radio" name="gender" id="other" value="other">
        <label for="other">other:</label><br><br>

        <label for="job">Jobtitle:</label>
        <input type="text" id="job" name="fjob"><br><br>

        <label for="dep">Department</label>
        <select name="department" id="dep">
            <option value="" disabled selected>select your departmrnt</option>
            <option value="engineer">engineer</option>
            <option value="it"> it</option>
            <option value="finance"> finance</option>
        </select><br><br>

        <button> submit</button>
    </form>
</body>
</html>
