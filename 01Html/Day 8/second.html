<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>iit jee form</h1>
    <form>
        <fieldset>
            <legend>iit jee form</legend>
        <label for="name">full name:</label>
        <input type="text" id="name"><br><br>

        <label for="email">Email:</label>
        <input type="email" name="email" id="email"><br><br>

        <label for="phone">Phone number:</label>
        <input type="tel" name="phone" id="phone"><br><br>

        <label for="pass">Password:</label>
        <input type="password" name="password" id="pass"><br><br>

        <label for="">Gender:</label>
        <input type="radio" name="gender" id="male" value="male">
        <label for="male">Male:</label>

        <input type="radio" name="gender" id="female" value="female">
        <label for="female">Female:</label>

        <input type="radio" name="gender" id="other" value="other">
        <label for="other">other:</label><br><br>

        <label for="date">DOB:</label>
        <input type="date" name="dob" id="date" min="2001-01-01" max="2005-12-31"><br><br>

        <label for="school">school: </label>
        <input type="text" id="school"><br><br>

        <label for="board"> board:</label>
        <select name="board" id="board">
            <option value=""disabled selected>select your board</option>
            <option value="icse">icse</option>
            <option value="cbse">cbse</option>
            <option value="hbse">hbse</option>
        </select><br><br>

        <label for="year"> year:</label>
        <input type="number" id="year" name="year" min="2023" max="2025"><br><br>

        <label for="center">Exam center:</label>
       
            <select name="center" id="center">
                <option value=""disabled selected>choose entre</option>
                <option value="">haryana</option>
                <option value="">up</option>
                <option value="">ambala</option>
                <option value="">hisar</option>
            </select><br><br>
            <button> register</button>
        

</fieldset>
    </form>
</body>
</html>
